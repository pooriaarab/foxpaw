<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxpaw</title>
    <link rel="stylesheet" href="sidebar.css" />
  </head>
  <body>
    <header>
      <h1>foxpaw</h1>
      <p>Type a goal for the current tab. foxpaw reads the page, acts on it, and checks the result.</p>
    </header>
    <form id="goal-form">
      <label for="goal">Goal</label>
      <textarea id="goal" rows="4" placeholder="Name: Sam Lee, email: sam@example.com, accept the terms"></textarea>
      <fieldset>
        <legend>Chooser</legend>
        <label><input type="radio" name="chooser" value="rule" checked /> Rules (no model)</label>
        <label><input type="radio" name="chooser" value="gliner" disabled /> GLiNER2 through foxmind</label>
        <p class="note" id="gliner-note">This build has no foxmind model, so only the rules chooser runs.</p>
      </fieldset>
      <button id="run" type="submit">Run</button>
    </form>
    <section aria-label="Run">
      <p id="status" role="status">Ready.</p>
      <h2>Steps</h2>
      <ol id="steps"></ol>
      <h2>Checklist</h2>
      <ul id="checks"></ul>
    </section>
    <script src="sidebar.js"></script>
  </body>
</html>
